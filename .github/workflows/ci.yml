name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      python: ${{ steps.filter.outputs.python }}
      tex: ${{ steps.filter.outputs.tex }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          # docs/ · design/ · .agents/ のみの変更では何も走らない（意図的）
          filters: |
            python:
              - 'pyproject.toml'
              - 'src/**'
              - 'tests/**'
              - 'packages/**'
              - 'schemas/**'
            tex:
              - 'Dockerfile'
              - 'compose.yaml'
              - 'scripts/**'
              - 'packages/**'
              - 'tests/fixtures/**'
              - 'src/entex/**'

  lint-test:
    name: lint / test (host, no TeX)
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package
        run: pip install -e ".[dev]"
      - name: Lint (ruff check)
        run: ruff check .
      - name: Format check (ruff format --check)
        run: ruff format --check .
      - name: Test (pytest — TeX tests skip here)
        run: pytest

  tex:
    name: tex smoke (docker, LuaLaTeX)
    needs: changes
    if: needs.changes.outputs.tex == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build dev image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: entex-dev:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Toolchain check (entex doctor)
        run: docker run --rm entex-dev:ci entex doctor
      - name: Japanese typesetting smoke (tests/fixtures/smoke.tex)
        run: docker run --rm -v "$PWD":/app entex-dev:ci sh scripts/tex-smoke.sh
      - name: Test (pytest — incl. TeX tests)
        run: docker run --rm -v "$PWD":/app entex-dev:ci pytest
