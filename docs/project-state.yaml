# Copy to docs/project-state.yaml in consumer repos. Update on gate pass / phase change.
# Session navigation (every turn): .agents/memory/state/nav.yaml 窶・see docs/PM_ROUTING.md
# Filled neutral example: docs/_example/project-state.yaml (do not use example slugs in production).
# Guide: docs/FIRST_PROJECT_START.md ﾂｷ Gate: docs/ROLES_AND_GOVERNANCE.md

current_phase: P0   # P0|P1|P2|P3|P4|P5|P6
phase_note: "New project EnTeX — repo bootstrap; defining product charter"    # e.g. "P5 done; returning to P2 for new requirement auth-v2"

scope_focus:      # which H level we are clarifying now
  level: H0       # H0|H1|H2|H3|H4|H5
  path: "docs/design/product/charter.md"        # e.g. docs/design/product/charter.md

active_pdca:      # primary S1 cycle (program or algorithm)
  plan_path: "docs/design/product/charter.md"   # e.g. .agents/plans/algorithms/sort-stable.md
  scope_level: algorithm
  pdca_class: S1

# Stage-gate status (Gate Keeper = user). See docs/ROLES_AND_GOVERNANCE.md
gate_status:
  current: pending        # pending | passed | conditional | recycled | hold | killed
  proposal: ""            # router/PM suggestion: Go | Conditional Go | Recycle | Hold | Kill | ""
  last_decision: ""       # e.g. P4-plan-sort-stable-go, P2-req-auth-conditional
  last_decided_at: ""     # ISO-8601 date optional, e.g. 2026-06-17
  conditions: []          # strings 窶・required before Conditional Go advances
  gate_keeper: user       # fixed; PM proposes, user decides

last_gate_passed: ""   # legacy shorthand; mirror last_decision when passed
allowed_actions:       # router uses for gate hints
  - design-deliberate
  - design-record
  # - plan-record          # uncomment when P3+H4/H5 ready
  # - implement-conduct    # uncomment when plan agreed

open_blockers: []

# Adaptive lifecycle (skill: adaptive-lifecycle-plan) 窶・AI-DLC Workflow Planning 逶ｸ蠖・
lifecycle_plan:
  profile: "standard"              # hotfix | spike | standard | full | doc_only | custom
  brownfield: false
  last_planned_at: ""      # ISO-8601
  executed_phases: []      # e.g. [P1, P2, P4]
  skipped_phases: []       # e.g. [P0]
  skipped_stages: []       # optional AI-DLC stage labels for audit
  recommended_cursor_mode: ""  # Ask | Plan | Agent | Debug | chain e.g. "Ask竊単lan竊但gent"
  requirements_depth: ""   # minimal | standard | comprehensive 窶・H-P4 ﾂｷ adaptive-lifecycle-plan
  unit_scope: ""           # e.g. docs/design/programs/example.md (H4/H5 unit)
  notes: ""

# Optional 窶・Linear・・ocs/LINEAR_PHASE_MAP.md・・
linear_sync:
  issue_state: ""   # design-draft | plan-agreed | do-running | ...
  issue_id: ""
  map_doc: docs/LINEAR_PHASE_MAP.md

