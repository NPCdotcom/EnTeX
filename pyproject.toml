[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "entex"
version = "0.0.1"
description = "EnTeX — form input to fixed-format PDF via LaTeX, for people who do not write TeX"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "TBD" }
authors = [
  { name = "NPC (NPCdotcom)" },
  { name = "Aster (Astel-isk)" },
]
dependencies = [
  "fastapi>=0.115",
  "pydantic>=2.9",
  "jinja2>=3.1",
  "typer>=0.12",
  "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "httpx>=0.27",
  "ruff>=0.5",
]

[project.scripts]
entex = "entex.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
# Agent-kit scripts are shared tooling, not application code.
extend-exclude = [".agents", ".cursor"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
